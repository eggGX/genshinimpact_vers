# Render Blueprint: optional free-tier trusted match API.
# Secrets MUST be entered in the Render dashboard; never committed.
services:
  - type: web
    name: genshin-card-match-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server
    startCommand: npm run start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGIN
        value: "https://genshincard-25028.web.app,http://localhost:5173"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
